name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Shipped code (React only) must have no known advisory at any level.
      - run: pnpm audit --prod
      # Build and test tooling runs in CI with the repo checked out, so high and critical advisories block too.
      - run: pnpm audit --audit-level high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the full git history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 --no-banner .'

  signoff:
    name: signoff
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          # Check out the PR head, not the synthetic merge commit (which has
          # no Signed-off-by and would fail every PR).
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify every commit is signed off
        run: |
          set -euo pipefail
          git fetch origin "${{ github.base_ref }}" --depth=1
          bad=$(git log --format='%H%x00%B%x00END%x00' \
                  "origin/${{ github.base_ref }}..HEAD" | \
                python3 -c "
          import sys
          data = sys.stdin.read()
          bad = []
          for chunk in data.split('\x00END\x00'):
              chunk = chunk.strip('\x00\n')
              if not chunk:
                  continue
              sha, _, body = chunk.partition('\x00')
              if 'Signed-off-by:' not in body:
                  bad.append(sha)
          print(' '.join(bad))
          ")
          if [ -n "$bad" ]; then
            echo "Commits missing Signed-off-by: $bad"
            echo "Fix: git rebase --signoff origin/${{ github.base_ref }}, then force-push."
            exit 1
          fi
          echo "All commits signed off."

  e2e-chromium:
    name: e2e chromium (${{ matrix.shard }}/2)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      MAKER_PORT: 5300
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run the chromium projects
        run: >-
          pnpm exec playwright test
          --project=chromium --project=android-handheld --project=chromebook
          --shard=${{ matrix.shard }}/2 --workers=2 --forbid-only --reporter=list,html
      - name: Check the tested build is the dist artifact
        run: diff -r "$RUNNER_TEMP/dist" "dist-e2e/$((MAKER_PORT + 1000))"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-chromium-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/**/trace.zip
          retention-days: 7

  e2e-webkit:
    name: e2e webkit
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MAKER_PORT: 5310
      PLAYWRIGHT_HTML_OPEN: never
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/dist
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-webkit
      - run: pnpm exec playwright install --with-deps webkit
      - name: Run the webkit projects
        run: >-
          pnpm exec playwright test
          --project=webkit-iphone --project=webkit-ipad
          --workers=2 --forbid-only --reporter=list,html
      - name: Check the tested build is the dist artifact
        run: diff -r "$RUNNER_TEMP/dist" "dist-e2e/$((MAKER_PORT + 1000))"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-webkit
          path: |
            playwright-report/
            test-results/**/trace.zip
          retention-days: 7

  ci-ok:
    name: ci-ok
    if: always()
    needs: [verify, secrets, signoff, e2e-chromium, e2e-webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every gate passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          # "skipped" is only ever the signoff job on non-PR events (pushes,
          # workflow_call from release.yml); a failed job is "failure".
          jq -e 'length == 5 and all(. == "success" or . == "skipped")' <<< "$RESULTS"
