name: Release

# Production deploys happen only from a v*.*.* tag on main. To roll back, run this workflow
# by hand ("Run workflow", then pick an older tag under "Use workflow from").

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-production
  cancel-in-progress: false

jobs:
  check:
    name: tag is on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.main.outputs.commit }}
    steps:
      - name: Require a release tag
        run: |
          if ! printf '%s' "$GITHUB_REF" | grep -Eq '^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Releases run from a vMAJOR.MINOR.PATCH tag only, not ${GITHUB_REF}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the tagged commit on main
        id: main
        run: |
          commit=$(git rev-parse "${GITHUB_REF}^{commit}")
          if [ "$commit" != "$(git rev-parse "${GITHUB_SHA}^{commit}")" ]; then
            echo "::error::The tag points at ${commit}, but this run is for ${GITHUB_SHA}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::${GITHUB_REF_NAME} (${commit}) is not on origin/main"
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is ${commit}, on origin/main"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  ci:
    name: ci
    needs: check
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: deploy production
    needs: [check, ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check the Cloudflare secrets
        env:
          HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAS_TOKEN" != "true" ] || [ "$HAS_ACCOUNT" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set to deploy production"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/deploy
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install wrangler from its lockfile
        run: npm ci --prefix .github/deploy --ignore-scripts --no-audit --no-fund
      - name: Deploy to production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.json
          COMMIT: ${{ needs.check.outputs.commit }}
        run: |
          .github/deploy/node_modules/.bin/wrangler pages deploy dist \
            --project-name makers-studio --branch main \
            --commit-hash "$COMMIT" --commit-message "Release ${GITHUB_REF_NAME}"
          environment=$(jq -r 'select(.type == "pages-deploy-detailed") | .environment // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          url=$(jq -r 'select(.type == "pages-deploy-detailed") | .url // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          if [ "$environment" != "production" ]; then
            echo "::error::Cloudflare made a ${environment:-unknown} deployment, not production. Is the project's production branch main?"
            exit 1
          fi
          echo "Deployed ${GITHUB_REF_NAME} to production: ${url}" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    name: github release
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
